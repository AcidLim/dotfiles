[keybinds]
# 显示快捷键教程
"Mod+Shift+Slash" = "spawn:~/.config/niri/scripts/niri-binds"

# alt+tab切换窗口
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"

# 特殊功能
"Mod+F1" = "spawn:pkill fcitx5 || fcitx5"
"Mod+F2" = "spawn:noctalia msg settings-toggle"
"Mod+F3" = "spawn:shorin-screenrec-menu"
"Mod+F5" = "spawn:quicksave"
"Mod+F8" = "spawn:quickload"
"Mod+P" = "spawn:~/.config/niri/scripts/niri-pick focus"

# 临时开一个浮动终端
"Mod+Slash" = "spawn:kitty --single-instance --class quickterminal"

# 打开浏览器
"Mod+B" = "spawn:microsoft-edge-stable"

# opencode ai助手
"Mod+Alt+O" = "spawn:kitty --class opencode -e opencode"

"Mod+T" = "spawn:kitty --single-instance"
"Mod+Return" = "spawn:kitty"

# 文档管理器。如果有thunar的话会优先打开thunar，没有的话会打开nautilus
"Mod+Alt+E" = "spawn:thunar || env GSK_RENDERER=gl GTK_IM_MODULE=fcitx nautilus"

# 另一个打开nautilus的快捷键
"Mod+E" = "spawn:env GSK_RENDERER=gl GTK_IM_MODULE=fcitx nautilus --new-window"

"Mod+Z" = "spawn:noctalia msg panel-toggle launcher"

# 壁纸选择
"Mod+Alt+W" = "spawn:noctalia msg panel-toggle wallpaper"

# 随机切换壁纸
"Mod+F10" = "spawn:noctalia msg wallpaper-random"

# 随机下载壁纸
"Mod+Shift+F10" = "spawn:~/.local/bin/random-anime-wallpaper-noctalia"

"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+G" = { action = "overview-toggle", repeat = false }

# 关闭聚焦窗口
#TODO("查看对应关闭窗口的ipc命令")
"Mod+Q" = { action = "window-close", repeat = false }
#"Alt+F4" = { action = "spawn:~/.config/niri/scripts/niri-force-kill-window", repeat = false }
#"Alt+Shift+F4" = { action = "spawn:~/.config/niri/scripts/niri-force-kill-window -f", repeat = false }

# scratchpad
# 切换 移动聚焦窗口至侧边栏（移入/移出 scratchpad）
"Mod+Alt+S" = "window-toggle-scratchpad:sidebar"
"Mod+M" = "window-toggle-scratchpad:sidebar"

# 切换 收起/展开侧边栏（显示/隐藏 scratchpad）
"Mod+Alt+Z" = "scratchpad-toggle:sidebar"

# 反向排序侧边栏：Umbriel 无直接排序动作
#"Mod+Alt+X" = "scratchpad-focus-next:sidebar"

# 重新排列侧边栏中的窗口：Umbriel 无直接重排动作
#"Mod+Alt+R" = "window-restore-from-scratchpad:sidebar"

# mod+鼠标中键 关闭窗口
"Mod+MouseMiddle" = "window-close"

# 切换聚焦
# super+方向键
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"

# super+vim key
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

# 移动colume（列）
# super+ctrl+方向键
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"

# super+ctrl+vimkey
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+L" = "column-move-right"

# super+ctrl+a/d 向左/右移动列
"Mod+Ctrl+A" = "column-move-left"
"Mod+Ctrl+D" = "column-move-right"

# mod+S/W 上下切换窗口聚焦
"Mod+W" = "window-focus-up"
"Mod+S" = "window-focus-down"

# 移动窗口
"Mod+Ctrl+S" = "window-move-down"
"Mod+Ctrl+W" = "window-move-up"

# 切换到第一个colume
"Mod+Home" = "column-focus-first"

# 切换到最后一个colume
"Mod+End" = "column-focus-last"

# 移动colume到第一个
"Mod+Ctrl+Home" = "column-move-to-first"

# 移动colume到最后一个
"Mod+Ctrl+End" = "column-move-to-last"

# 切换显示器聚焦
# mod+shift+方向键
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"

# mod+shift+vimkey
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+J" = "output-focus-down"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+L" = "output-focus-right"

# 跨显示器移动colume
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"
"Mod+Shift+Ctrl+A" = "column-move-to-output-left"
"Mod+Shift+Ctrl+S" = "column-move-to-output-down"
"Mod+Shift+Ctrl+W" = "column-move-to-output-up"
"Mod+Shift+Ctrl+D" = "column-move-to-output-right"

# 移动整个工作区
# mod+shift跨显示器，alt代表移动整个工作区，再加上三组方向键
"Mod+Shift+Alt+W" = "workspace-move-to-output-up"
"Mod+Shift+Alt+S" = "workspace-move-to-output-down"
"Mod+Shift+Alt+D" = "workspace-move-to-output-right"
"Mod+Shift+Alt+A" = "workspace-move-to-output-left"

"Mod+Shift+Alt+K" = "workspace-move-to-output-up"
"Mod+Shift+Alt+J" = "workspace-move-to-output-down"
"Mod+Shift+Alt+L" = "workspace-move-to-output-right"
"Mod+Shift+Alt+H" = "workspace-move-to-output-left"

"Mod+Shift+Alt+Up" = "workspace-move-to-output-up"
"Mod+Shift+Alt+Down" = "workspace-move-to-output-down"
"Mod+Shift+Alt+Right" = "workspace-move-to-output-right"
"Mod+Shift+Alt+Left" = "workspace-move-to-output-left"

# mod+shitf+滚轮上下切换工作区
"Mod+Shift+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+Shift+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }

# 再加上ctrl移动窗口
"Mod+Ctrl+Shift+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+Shift+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

# mod+滚轮上下 左右切换聚焦
"Mod+WheelDown" = "window-focus-right"
"Mod+WheelUp" = "window-focus-left"

# 再加上ctrl移动colume
"Mod+Ctrl+WheelDown" = "column-move-right"
"Mod+Ctrl+WheelUp" = "column-move-left"

# mod+左右方括号 移动窗口（不是移动colume，是允许移动到另一个colume的窗口移动）
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"

# mod+A/D 同效果
"Mod+A" = "window-consume-or-expel-left"
"Mod+D" = "window-consume-or-expel-right"

# mod+逗号/句号 把窗口合并或者踢出当前的colume
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-or-expel-left"

# mod+shift+A/D 同效果
"Mod+Shift+A" = "window-consume-left"
"Mod+Shift+D" = "window-consume-or-expel-left"

# 开启colume的标签页模式
"Mod+Shift+X" = "column-toggle-tabbed"
#"Mod+X" = "column-toggle-tabbed"

# mod+鼠标侧键 上下切换聚焦
"Mod+MouseForward" = "window-focus-up"
"Mod+MouseBack" = "window-focus-down"

# 按照预设切换窗口宽度
"Mod+R" = "window-cycle-primary-extent"

# 按照预设切换窗口高度
"Mod+Shift+R" = "window-cycle-secondary-extent"

# 重置窗口高度（Umbriel 无直接重置，设为最大高度）
"Mod+Ctrl+R" = "window-set-secondary-extent:1.0"

"Mod+F" = "window-toggle-maximize"
"Mod+Alt+F" = "window-toggle-fullscreen"

# 增加窗口宽度占满空闲空间
"Mod+Ctrl+F" = "window-set-primary-extent:1.0"

# 居中当前聚焦的colume
"Mod+C" = "column-center"
#"Mod+Ctrl+C" = "center-visible-columns"   # Umbriel 无直接对应

# mod+加减号调整窗口宽度
"Mod+Minus" = "window-modify-primary-extent:-0.05"
"Mod+Equal" = "window-modify-primary-extent:0.05"

# mod+shift+加减号调整窗口高度
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.05"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.05"

# 切换浮动模式
"Mod+V" = "window-toggle-floating"

# 在浮动模式和非浮动模式之间切换聚焦
"Mod+Shift+V" = "window-focus-switch-floating"
"Mod+N" = "window-focus-switch-floating"
"Alt+grave" = "window-focus-switch-floating"
"Mod+Alt+N" = "window-focus-switch-floating"

# 截图相关（Umbriel 无内置截图，使用 grim + slurp）
"Mod+Alt+A" = "spawn:grim -g \"$(slurp)\" && pkill -f -USR1 screenshot-sound.sh"  #选取区域截图
"Mod+Alt+Ctrl+A" = "spawn:grim -g \"$(slurp -w 0)\" && pkill -f -USR1 screenshot-sound.sh"  #选取聚焦窗口
"Mod+Alt+Ctrl+Shift+A" = "spawn:grim && pkill -f -USR1 screenshot-sound.sh"  #截取显示器
"Print" = "spawn:grim -g \"$(slurp)\" && pkill -f -USR1 screenshot-sound.sh"
"Ctrl+Print" = "spawn:grim -g \"$(slurp -w 0)\" && pkill -f -USR1 screenshot-sound.sh"
"Shift+Print" = "spawn:grim && pkill -f -USR1 screenshot-sound.sh"
"Mod+Shift+S" = "spawn:wl-paste | satty -f -"  #截图后使用此快捷键编辑

"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+E" = "session-quit"

# 电源菜单
"Mod+Shift+P" = "spawn:noctalia msg panel-toggle session"

# 剪贴板
"Mod+Alt+V" = "spawn:noctalia msg panel-toggle clipboard"

# 锁屏
"Mod+Alt+L" = "spawn:noctalia msg session lock"

# 锁屏、关闭显示器、休眠
"Mod+Alt+P" = "spawn:noctalia msg session lock-and-suspend"


# === 媒体控制 ===
"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-"
"XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioNext" = "spawn:noctalia msg media next"
"XF86AudioPrev" = "spawn:noctalia msg media previous"
"XF86AudioPause" = "spawn:noctalia msg media toggle"
"XF86AudioPlay" = "spawn:noctalia msg media toggle"

"XF86MonBrightnessUp" = "spawn:brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 5%-"

##备选ipc指令
#"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
#"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
#"XF86AudioMute" = "spawn:noctalia msg volume-mute"
#"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
#"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"


# === 工作区导航补充 (无冲突项) ===
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"

"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"

"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"

# === 数字工作区 (1-9) ===
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"

"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"
