[[window_rule]]
match.app_id = "firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^zoom$"
default_floating = true

# ---------- quickshell ----------
[[window_rule]]
match.app_id = "org\\.quickshell$"
default_floating = true

