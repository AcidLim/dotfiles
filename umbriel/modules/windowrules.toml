# ---------- 快速终端 ----------
[[window_rule]]
match.app_id = "^quickterminal$"
default_floating = true
default_position = { x = 20, y = 20, anchor = "top" }

# ---------- bluetui / impala ----------
[[window_rule]]
match.app_id = "^bluetui$"
default_floating = true
default_floating_size_px = { width = 800, height = 800 }

[[window_rule]]
match.app_id = "^impala$"
default_floating = true
default_floating_size_px = { width = 800, height = 800 }

# ---------- clipse ----------
[[window_rule]]
match.app_id = "^clipse$"
default_floating = true
default_floating_size_px = { width = 625, height = 700 }

# ---------- waydroid / gsr ui ----------
[[window_rule]]
match.title = "^gsr ui$"
default_fullscreen = true
default_floating = true
border_effect = "off"
shadow = false

[[window_rule]]
match.app_id = "^waydroid$"
default_fullscreen = true
default_floating = true
border_effect = "off"
shadow = false

# ---------- 图片/视频查看器，取消透明度并浮动 ----------
[[window_rule]]
match.title = "^图片查看器$"
default_floating = true
opacity = 1.0

[[window_rule]]
match.title = "^画中画$"
default_floating = true
opacity = 1.0

[[window_rule]]
match.title = "^图片和视频$"
default_floating = true
opacity = 1.0

[[window_rule]]
match.title = "^视频播放器$"
