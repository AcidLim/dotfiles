opacity = 1.0

[[window_rule]]
match.app_id = "^mpv$"
opacity = 1.0

[[window_rule]]
match.app_id = "^celluloid$"
opacity = 1.0

# ---------- WezTerm 默认 ----------
[[window_rule]]
match.app_id = "^org\\.wezfurlong\\.wezterm$"

# ---------- GNOME 应用圆角 ----------
[[window_rule]]
match.app_id = "^org\\.gnome\\."
corner_radius = 12

# ---------- gnome-control-center / pavucontrol / nm-connection-editor ----------
[[window_rule]]
match.app_id = "^gnome-control-center$"
default_scrolling_extent = 0.5
default_floating = false

[[window_rule]]
match.app_id = "^pavucontrol$"
default_scrolling_extent = 0.5
default_floating = false

[[window_rule]]
match.app_id = "^nm-connection-editor$"
default_scrolling_extent = 0.5
default_floating = false

# ---------- 计算器 / 蓝牙 / portal ----------
[[window_rule]]
match.app_id = "^gnome-calculator$"
default_floating = true

[[window_rule]]
match.app_id = "^galculator$"
default_floating = true

[[window_rule]]
match.app_id = "^blueman-manager$"
default_floating = true

[[window_rule]]
match.app_id = "^xdg-desktop-portal$"
default_floating = true

# ---------- Steam 通知 toast ----------
[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_\\d+_desktop$"
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false

