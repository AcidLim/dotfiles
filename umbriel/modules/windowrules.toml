# ============================================================
# Umbriel window rules — 从 niri 迁移
# ============================================================

# ---------- 全局默认 ----------
[[window_rule]]
# 全局圆角
corner_radius = 8

# ---------- imv ----------
[[window_rule]]
match.app_id = "^imv$"
default_floating = true

# ---------- Steam 好友列表 ----------
[[window_rule]]
match.app_id = "^steam$"
match.title = "^Friends List$"
default_scrolling_extent = 0.2

[[window_rule]]
match.app_id = "^steam$"
match.title = "^好友列表$"
default_scrolling_extent = 0.2

# ---------- shorinclip 剪贴板 TUI ----------
[[window_rule]]
match.app_id = "^shorinclip$"
default_floating = true
default_floating_size_px = { width = 625, height = 700 }
default_position = { x = 0, y = 18, anchor = "top" }

