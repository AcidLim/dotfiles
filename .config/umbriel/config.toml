# ==============================================================================
# Umbriel 主配置
#
#   这里只留三件事：include 顺序、[general]、[environment]。
#   include 顺序就是优先级：表按键合并、标量后者覆盖；规则数组按顺序追加。
#   窗口/层规则集中在 modules/rule/，文件名前缀 00→80 即优先级，
#   00 是无 match 的兜底（必须第一），80 是特殊场景覆写（必须最后）。
# ==============================================================================

[include]
files = [
    # ---- 外观 / 输入 / 输出 / 布局 / 动画 ----
    "modules/appearance.toml",
    "modules/input.toml",
    "modules/outputs.toml",
    "modules/layout.toml",
    "modules/animations.toml",
    "modules/scratchpad.toml",

    # ---- 规则：编号即优先级 ----
    "modules/rule/00-defaults.toml",
    "modules/rule/10-float.toml",
    "modules/rule/20-size.toml",
    "modules/rule/30-placement.toml",
    "modules/rule/40-blur.toml",
    "modules/rule/50-layer-blur.toml",
    "modules/rule/60-opacity.toml",
    "modules/rule/70-decoration.toml",
    "modules/rule/80-override.toml",

    # ---- 键位 ----
    "modules/binds.toml",
    "modules/supertab.toml",
]

[general]
autostart = [
    "noctalia",
    "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
    "sh -c 'systemctl --user set-environment XDG_SESSION_CLASS=user'",
    "fcitx5",
    "sh -c '~/.config/niri/scripts/screenshot-sound.sh'",
    "xhost +si:localuser:root",
    "sh -c 'sleep 3 && noctalia msg wallpaper-random'",
    "systemctl --user start linuxqq-clipsync",
    "bash ~/.config/umbriel/scripts/maximized-bar.sh",
]
mod_key = "Super"
xwayland = true
xwayland_native_resolution = false
show_cheatsheet = false
focus_on_activate = false
honor_restored_maximize = false

[environment]
LANGUAGE = "zh_CN:en"
LANG = "zh_CN.UTF-8"
XMODIFIERS = "@im=fcitx"
QT_QPA_PLATFORMTHEME = "gtk3"
QT_QPA_PLATFORMTHEME_QT6 = "gtk3"
QS_ICON_THEME = "Adwaita"
EDITOR = "nvim"

# noctalia 模板生成的配色（本仓库 gitignore，缺失时自动忽略并持续监视）
[include.optional]
files = ["noctalia.toml"]
