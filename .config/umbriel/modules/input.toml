# 输入设备：键盘 / 触控板 / 鼠标 / 焦点 / 光标
# （原 config.toml 的 [input*] + modules/cursor.toml 合并而来）

[input]
middle_click_paste = false
client_window_drag = true
window_drag_toggle = "none"

[input.keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 35
repeat_delay = 250
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
natural_scroll = false
left_handed = false
accel_profile = "flat"
sensitivity = -0.15
scroll_wheel_step = 60

[input.focus]
follows_mouse = false

# niri: xcursor-theme "breeze_cursors" / xcursor-size 30 / hide-after-inactive-ms 15000
[input.cursor]
theme = "breeze_cursors"
size = 30
hide_timeout_ms = 15000
