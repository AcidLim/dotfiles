# 70 装饰 —— 圆角 / 边框 / 阴影 / 标题栏
#
# 这些只影响「围着窗口画什么」，不改布局间距（全局值见 appearance.toml）。

# ---- 只有浮动窗口显示标题栏 ----
# 全局 appearance.title_bar.mode = "off"，这里用状态选择器把它打开。
# 选了 negotiated 而不是 on：自带 CSD 的应用（GNOME 系、GTK4/Electron）
# 保留自己的标题栏，不会被再叠一层；没有 CSD 的浮动窗口才由 Umbriel 补一条。
# 这个选择器会在窗口浮动/平铺切换时立即重新求值（Mod+V 当场生效）。
# 某个应用想要无条件 Umbriel 标题栏，就在下面单独给它写 title_bar = "forced"。
[[window_rule]]
match.is_floating = true
title_bar = "negotiated"

# ---- 圆角：只有浮动窗口有 ----
# 全局 appearance.corner_radius = 0，所以平铺窗口保持直角（niri 风格）。
# 状态选择器，Mod+V 切浮动/平铺会立即生效。
[[window_rule]]
match.is_floating = true
corner_radius = 12

# 贴边最大化（window-toggle-maximize-to-edges）不要圆角。
# 必须排在浮动规则之后；该选择器随窗口状态实时刷新。
# 注意：Mod+F 用的是 window-toggle-maximize（列满宽、保留间隙），
# 那个状态 JSON 里叫 maximized，Umbriel 没有对应的选择器，命中不了这条。
[[window_rule]]
match.is_maximized_to_edges = true
corner_radius = 0

# Noctalia / Quickshell 自己的窗口保持直角：
# 它们是浮层性质、自己画背景，再裁圆角会露出后面对内容。
# （Noctalia 的 bar / panel / dock 是 layer-shell 表面，本来就不受窗口圆角影响。）
[[window_rule]]
corner_radius = 0
match.app_id = ["^dev\\.noctalia\\.", "^org\\.quickshell$"]

# 全屏工具：不画边框效果、不要阴影
[[window_rule]]
border_effect = "off"
shadow = false
match.title = ["^gsr ui$"]

[[window_rule]]
border_effect = "off"
shadow = false
match.app_id = ["^waydroid$"]

# 暂存区窗口用单独边框色（原写在 noctalia.toml，那个文件由模板生成、会被覆盖）
[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#dabde2FF"
border_color_unfocused = "#553f5dFF"
