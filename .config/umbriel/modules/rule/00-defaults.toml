# 00 兜底规则 —— 无 match，命中所有窗口，必须排在本目录最前
#
# 规则语义：每条匹配的规则都贡献字段，同字段「后者胜」。
# 这里设的 blur 会被 40-blur.toml 里按应用开的 blur 覆盖。
#
# blur_optimized = false 全局生效（按你的决定）：窗口模糊采样真实内容，
# 有 GPU 开销；想省性能就把它改成 true，再对浮窗/面板单独设 false。
#
# 为什么只有 blur 在这里？
#   corner_radius / border_width / shadow / title_bar 都有对应的
#   [appearance.*] 标量，无 match 的规则与它完全等价，写两处只会互相打架。
#   所以装饰类的全局值一律写 modules/appearance.toml，
#   本目录的 70-decoration.toml 只做「按应用/状态覆写」。
#   blur 例外：appearance.blur 是引擎参数（passes/radius…）+ 总开关，
#   没有「每个窗口默认开关」的标量，只能靠这条无 match 规则表达默认 off。

[[window_rule]]
blur = false
blur_optimized = false
