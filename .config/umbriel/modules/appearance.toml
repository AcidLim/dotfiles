# 外观：全局标量 + 模糊参数 + 阴影
#
# 模糊分三层，别再混在一起看：
#   [appearance.blur]      ← 本文件：全局效果参数（passes/radius/noise…）
#   [[window_rule]] blur*  ← modules/rule/40-blur.toml：窗口（xdg_toplevel）
#   [[layer_rule]]  blur*  ← modules/rule/50-layer-blur.toml：层表面（bar/dock/launcher…）
#
# 原 modules/blur.toml 已并入本文件。

# 全局标量是这些字段的唯一来源：corner_radius / border_width / shadow / title_bar。
# 按应用覆写写 modules/rule/70-decoration.toml；
# 不要再写「无 match 的 [[window_rule]]」去设它们（与这里等价，纯重复）。
[appearance]
drag_opacity = 1
prefer_no_csd = true
border_width = 2
corner_radius = 0

# niri: blur { passes 3; offset 3; noise 0.02; saturation 1.5 }
# niri 的 offset 在 Umbriel 里近似映射到 radius。
[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.5

# niri: shadow { on; softness 20; spread 2; offset x=-4 y=-4 }
# 注意：niri 的 shadow spread 在 Umbriel 中没有对应项；阴影颜色见 colors（现由
# noctalia.toml 提供，默认 #0000007f）。
[appearance.shadow]
enabled = true
softness = 20
offset_x = -4
offset_y = -4

# 全局关闭标题栏：平铺窗口不画，只有浮动窗口由 rule/70-decoration.toml 打开。
#   off        = 不画
#   negotiated = 只有「Wayland 装饰协商选中服务端装饰 / X11 有 WM 装饰提示」才画
#                → 自带 CSD 的应用保留自己的标题栏，不会被叠一层
#   on         = 跟随客户端偏好，实测会给 CSD 应用也叠 Umbriel 标题栏
#   forced     = 无条件画（客户端自己画的 headerbar 不会被移除，会双层）
# 想让某个浮动窗口强制出现 Umbriel 标题栏，就在 70-decoration.toml 给它单独写 forced。
[appearance.title_bar]
mode = "off"
buttons = ["minimize", "maximize", "close"]
