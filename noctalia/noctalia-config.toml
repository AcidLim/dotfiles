[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.68999998457729816
tint_intensity = 0.0

[bar]
order = ["main", "bar"]

[bar.main]
position           = "right"       # top | bottom | left | right
enabled            = true
reserve_space      = true        # reserve compositor exclusive zone / push windows away
layer              = "top"       # top | overlay; overlay appears above fullscreen apps

thickness          = 40          # bar cross-axis size in pixels (height for horizontal, width for vertical)
background_opacity = 0.7        # 0.0 (transparent) to 1.0 (opaque)
border             = "outline"   # color role or #RRGGBB for the bar outline
border_width       = 0.0         # inside outline width in pixels; 0 disables it
shadow             = true        # cast the global [shell.shadow]
panel_overlap      = 12           # logical px an attached panel overlaps the bar edge to hide the seam
margin_ends        = 100         # inset from each end of the bar along its main axis
margin_edge        = 10           # distance from the nearest screen edge (positive values float the bar)
margin_opposite_edge = 0         # extra reserved space on the inward side of the bar (below for top, above for bottom)
padding            = 14          # main-axis padding from bar edges to start/end widget sections
widget_spacing     = 10           # gap between widgets within a section
scale              = 1.1         # content scale multiplier for icons and text
font_weight        = 500         # CSS weight 100–1000 (e.g. 400 regular, 700 bold); primary label weight for bar widgets
font_family        = "JetBrains Mono"          # typeface for this bar's widgets; empty inherits the global font

# Default capsule style for all widgets on this bar (see Widget Capsule section)
#capsule            = false
#capsule_fill       = "surface_variant"
#capsule_thickness  = 0.76          # capsule size across the bar as a fraction of bar thickness (1.0 fills the bar)
#capsule_radius     = 8.0            # omit for automatic pill radius
#capsule_opacity    = 1.0
#capsule_foreground = "secondary"
# capsule_border   = "outline"   # omit this key for no border by default

start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "network", "volume", "brightness", "battery","notifications", "control-center", "session"]


[bar.bar]
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 0.79
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.95999998226761818
enabled = false
panel_overlap = 12
font_family = "JetBrains Mono"
margin_ends = 14
margin_edge = 10
scale = 1.1
shadow = false
end = [
    "media",
    "tray",
    "wallpaper",
    "mpvpaper",
    "volume",
    "notifications",
    "session",
]
center = ["clock"]
start = ["launcher", "workspaces", "active_window"]
thickness = 36


[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 30

[brightness]
enable_ddcutil = false

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000003"]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000003]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 720.0
rotation = 0.0
type = "fancy_audio_visualizer"

[desktop_widgets.widget.desktop-widget-0000000000000003.settings]
background = false
visualization_mode = "wave_rings"

[dock]
auto_hide = false
enabled = true
margin_edge = 10
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 360.0

[hooks]
theme_mode_changed = ["~/.config/noctalia/theme-sync.sh"]
wallpaper_changed = ["~/.config/noctalia/scripts/matugen/matugen.sh"]

[hot_corners.bottom_right]
action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true


[location]
custom_schedule = false

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 5500

[osd]
background_opacity = 0.84999998100101948
offset_y = 20
position = "bottom_center"
scale = 0.90000000596046448

[osd.kinds]
media = false

[notification]
position = "bottom_right"

[shell]
font_family = "Noto Sans CJK SC"
polkit_agent = true
settings_show_advanced = true

[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"

[shell.panel]
transparency_mode = "glass"

control_center_placement = "floating"
open_near_click_control_center = true

control_center_position = "auto"
session_placement = "floating"
session_position = "center"

wallpaper_placement = "floating"
wallpaper_position = "center"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "notify-send 'Noctalia' 'Custom session entry'"
countdown_seconds = 0.0
enabled = false
variant = "default"

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["niri"]
community_ids = []

[wallpaper]
directory = "/home/acid/Pictures/Wallpapers"
fill_mode = "crop"


[plugins]
enabled = ["noctalia/mpvpaper"]

#小组件设置
[widget.launcher]
glyph = "menu-3"                # 使用 Tabler Icons 的 menu‑2 菜单图标
custom_image_colorize = true    # 如果后续设置自定义图片，则允许图标跟随主题上色

[widget.workspaces]
style = "regular"
capsule = true
capsule_opacity = 0.3
display = "none"

[widget.active_window]
min_length = 0

[widget.clock]
# 显示格式：简写星期, 日期 简写月份 时:分:秒
format = "{:%a, %d %b %H:%M:%S}"
vertical_format = "{:%H\n%M\n%S}"

[widget.tray]
detached_panel = true
drawer = true

[widget."ray/echolyrics:echolyrics"]
capsule = false

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

#插件设置
[plugin_settings."noctalia/mpvpaper"]
mpv_options = "--script=~/.config/noctalia/mpv-hook.lua"
picker_placement = "floating"
video_directory = "/home/acid/Pictures/Wallpapers/video"
