[plugins]
enabled = []

[shell]
corner_radius_scale = 0.0
font_family = "Noto Sans CJK SC"
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "pkexec"

    [shell.launcher]
    pinned = [ "flclash", "linuxqq-wayland-fix" ]

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "auto"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    countdown_seconds = 0.0
    enabled = false
    variant = "default"

[templates]

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk4", "niri", "umbriel" ]
    community_ids = []

[wallpaper]
directory = "/home/acid/Pictures/Wallpapers"
directory_dark = "/home/acid/Pictures/Wallpapers/Dark"
directory_light = "/home/acid/Pictures/Wallpapers/Light"
fill_mode = "crop"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 300
    recursive = true

    [wallpaper.default]
    path = "/home/acid/Pictures/Wallpapers/Light/wall_1782796769.png"

    [wallpaper.last]
    path = "/home/acid/Pictures/Wallpapers/Light/wall_1782796769.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/acid/Pictures/Wallpapers/Dark/1791019676098.jpeg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/acid/Pictures/Wallpapers/Light/wall_1782406570.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/acid/Pictures/Wallpapers/Dark/wall_1786255667.png"

    [wallpaper.monitors.eDP-2]
    path = "/home/acid/Pictures/Wallpapers/Light/wall_1782796769.png"

[widget.active_window]
min_length = 0

[widget.audio_visualizer]
bands = 24
mirrored = false

[widget.battery]
show_label = false

[widget.brightness]
enabled = false

[widget.clock]
format = "{:%b%d%a %H:%M:%S}"
vertical_format = """{:%H
%M
%S}"""

[widget.launcher]
custom_image_colorize = true
glyph = "brand-apple"

[widget.media]
hide_when_no_media = true
max_length = 160
rotate_album_art = true
show_progress = true
title_scroll = "always"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.privacy]
hide_inactive = true

[widget."ray/echolyrics:echolyrics"]
capsule = false

[widget.taskbar]
group_by_workspace = true
group_single_icon_per_app = true
hide_empty_workspaces = true

[widget.text_2]
color = "primary"
text = "/"
type = "text"

[widget.text_3]
color = "primary"
text = "/"
type = "text"

[widget.text_4]
text = "「"
type = "text"

[widget.text_5]
text = "」"
type = "text"

[widget.text_6]
text = "/"
type = "text"

[widget.text_7]
text = "」"
type = "text"

[widget.text_8]
text = "「"
type = "text"

[widget.text_9]
color = "primary"
text = "|"
type = "text"

[widget.tray]
detached_panel = true
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
capsule = true
capsule_opacity = 0.5
label_source = "id"
show_labels = false
style = "regular"
